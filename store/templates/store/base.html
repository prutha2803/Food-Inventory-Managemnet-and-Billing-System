<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% load static %}
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="https://unpkg.com/@webpixels/css@1.1.5/dist/index.css">
        <link rel="stylesheet" href="{% static 'css/style.css' %}" type="text/css">
        {% block stylesheets %}{% endblock stylesheets %}
        <title>Food and Billing: {% block title %} {% endblock title %}</title>

        <!-- Favicon -->
        <link rel="icon" href="{% static 'images/logo/favicon.png' %}" type="image/png">
    </head>
    <body>
      <style>
        /* Main background color */
        body {
          background-color: #f0f8ff; /* Light blue color */
          font-family: 'Arial', sans-serif;
          color: #333;
        }

        /* Navbar customization */
        .navbar {
          background-color: #006f71; /* Teal color */
        }
        .navbar-brand {
          font-size: 20px;
          color: white;
        }
        .navbar-nav .nav-link {
          color: #ffffff;
        }
        .navbar-nav .nav-link:hover {
          color: #f0f8ff; /* Light blue on hover */
        }

        /* Sidebar */
        #wrapper {
          background-color: #f8f9fa; /* Light background for wrapper */
        }

        /* Paginator */
        .paginator {
          display: flex;
          justify-content: center;
          padding-top: 20px;
        }

        /* Customize buttons */
        .btn-primary {
          background-color: #008c8c; /* Dark teal */
          border: none;
        }
        .btn-primary:hover {
          background-color: #006f71; /* Darker teal */
        }

        /* Links */
        .text-warning {
          color: #f39c12; /* Bright yellow */
        }
        .text-danger {
          color: #e74c3c; /* Red for error messages */
        }

        /* Adjust form controls */
        .form-control {
          border-radius: 5px;
          padding: 10px;
          border: 1px solid #ddd;
        }
      </style>

      {% include "store/sidebar.html" %}
      <section id="wrapper">
          <nav class="navbar navbar-expand-md">
              <div class="container-fluid mx-2">
                <div class="navbar-header">
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#toggle-navbar" aria-controls="toggle-navbar" aria-expanded="false" aria-label="Toggle navigation">
                    <i class="fa fa-bars text-white"></i>
                  </button>
                  <a class="navbar-brand" href="{% url 'dashboard' %}">Food Inventory Management<span class="text-warning"> and Billing System</span></a>
                </div>
                <div class="collapse navbar-collapse" id="toggle-navbar">
                  <ul class="navbar-nav ms-auto">
                    <!-- You can add more items here -->
                  </ul>
                </div>
              </div>
          </nav>

          {% block content %}
          {% endblock content %}
      </section>

      <!-- Bootstrap core JavaScript-->
      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

      <!-- Core plugin JavaScript-->
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

      {% block javascripts %}{% endblock javascripts %}
    </body>
</html>
